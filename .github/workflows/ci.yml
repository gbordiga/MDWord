name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm test
      - run: pnpm --filter @mdword/web typecheck
      - run: pnpm build:web

  package-linux:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt ${attempt}), retrying..."
            sleep 20
          done
          exit 1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - run: pnpm build:web
      - run: mkdir -p apps/desktop/resources/web && cp -R apps/web/out/* apps/desktop/resources/web/
      - name: Build Linux packages
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @mdword/desktop dist -- --linux --publish never; then
              exit 0
            fi
            echo "desktop dist failed (attempt ${attempt}), retrying..."
            rm -rf "$HOME/.cache/electron-builder/appimage"* apps/desktop/release
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mdword-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
