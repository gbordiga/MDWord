name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  verify-version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $pkg" >&2
            exit 1
          fi

  linux:
    needs: verify-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt ${attempt}), retrying..."
            sleep 20
          done
          exit 1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - run: pnpm test
      - run: pnpm build:web
      - run: mkdir -p apps/desktop/resources/web && cp -R apps/web/out/. apps/desktop/resources/web/
      - name: Build and publish Linux packages
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @mdword/desktop dist:publish -- --linux; then
              exit 0
            fi
            echo "desktop publish failed (attempt ${attempt}), retrying..."
            rm -rf "$HOME/.cache/electron-builder/appimage"* apps/desktop/release
            sleep 20
          done
          exit 1

  windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt ${attempt}), retrying..."
            sleep 20
          done
          exit 1
        shell: bash
      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - run: pnpm test
      - run: pnpm build:web
      - name: Stage the web build for the installer
        run: |
          mkdir -p apps/desktop/resources/web
          cp -R apps/web/out/. apps/desktop/resources/web/
        shell: bash
      - name: Build and publish Windows installer
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @mdword/desktop dist:publish -- --win; then
              exit 0
            fi
            echo "desktop publish failed (attempt ${attempt}), retrying..."
            rm -rf apps/desktop/release
            sleep 20
          done
          exit 1
        shell: bash

  # A release is only done when both platforms are on it with current metadata;
  # installed apps read latest*.yml to find the next version.
  verify-release:
    needs: [linux, windows]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check every desktop artifact is published
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
