name: Release Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt ${attempt}), retrying..."
            sleep 20
          done
          exit 1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - run: pnpm test
      - run: pnpm build:web
      - run: mkdir -p apps/desktop/resources/web && cp -R apps/web/out/. apps/desktop/resources/web/
      - name: Build Linux packages
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @mdword/desktop dist -- --linux --publish never; then
              exit 0
            fi
            echo "desktop dist failed (attempt ${attempt}), retrying..."
            rm -rf "$HOME/.cache/electron-builder/appimage"* apps/desktop/release
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: mdword-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
