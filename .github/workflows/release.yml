name: Release Linux

on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:web
      - run: mkdir -p apps/desktop/resources/web && cp -R apps/web/out/. apps/desktop/resources/web/
      - run: pnpm --filter @mdword/desktop dist -- --linux
      - uses: actions/upload-artifact@v4
        with:
          name: mdword-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
