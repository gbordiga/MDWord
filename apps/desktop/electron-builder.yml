appId: app.mdword.desktop
productName: MDWord
copyright: Copyright © 2026 Giacomo Bordiga
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
  - "!resources/web/**"
asar: true
extraResources:
  - from: resources/web
    to: web
extraMetadata:
  name: mdword
  author: Giacomo Bordiga
fileAssociations:
  - ext:
      - md
      - markdown
      - mdown
      - mkd
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icon.ico
win:
  icon: resources/icon.ico
  target:
    - nsis
  artifactName: MDWord-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
mac:
  icon: resources/icon.png
  target:
    - dmg
  category: public.app-category.productivity
  artifactName: MDWord-${version}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  category: Office
  executableName: MDWord
  maintainer: Giacomo Bordiga <gbordiga@gmail.com>
  artifactName: MDWord-${version}.${ext}
  mimeTypes:
    - text/markdown
    - text/x-markdown
publish: null
