appId: app.mdword.desktop
productName: MDWord
copyright: Copyright © 2026 Giacomo Bordiga
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
asar: true
extraMetadata:
  name: mdword
  author: Giacomo Bordiga
win:
  target:
    - nsis
  artifactName: MDWord-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.productivity
  artifactName: MDWord-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Office
  executableName: MDWord
  maintainer: Giacomo Bordiga <gbordiga@gmail.com>
  artifactName: MDWord-${version}.${ext}
publish: null
